name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install

      - name: Create D1 database if needed
        run: |
          echo "Checking for D1 database..."
          npx wrangler d1 list --json 2>/dev/null > /tmp/d1_list.json || true
          HAS_DB=$(cat /tmp/d1_list.json 2>/dev/null | node -e "
            let data=''; process.stdin.on('data',c=>data+=c); process.stdin.on('end',()=>{
              try { const list=JSON.parse(data); const db=list.find(d=>d.name==='snap-it-db'); console.log(db?'yes':'no'); }
              catch(e) { console.log('no'); }
            });
          " 2>/dev/null || echo "no")
          if [ "$HAS_DB" != "yes" ]; then
            echo "Creating D1 database snap-it-db..."
            npx wrangler d1 create snap-it-db 2>&1 || true
            # Re-list to get the new ID
            npx wrangler d1 list --json 2>/dev/null > /tmp/d1_list.json || true
          else
            echo "D1 database snap-it-db already exists"
          fi

      - name: Patch wrangler.toml with D1 ID
        run: |
          D1_ID=$(cat /tmp/d1_list.json 2>/dev/null | node -e "
            let data=''; process.stdin.on('data',c=>data+=c); process.stdin.on('end',()=>{
              try { const list=JSON.parse(data); const db=list.find(d=>d.name==='snap-it-db'); console.log(db?db.uuid:''); }
              catch(e) { console.log(''); }
            });
          " 2>/dev/null)
          echo "D1_ID=$D1_ID"
          if [ -n "$D1_ID" ]; then
            sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$D1_ID/g" wrangler.toml
            echo "Patched wrangler.toml with D1 ID"
          else
            echo "WARNING: Could not find D1 ID"
            npx wrangler d1 list 2>&1 || true
          fi
          cat wrangler.toml

      - name: R2 bucket
        run: npx wrangler r2 bucket create snap-it-documents 2>&1 || true

      - name: Migrations
        run: |
          echo "Running schema.sql..."
          npx wrangler d1 execute snap-it-db --file=src/db/schema.sql --remote 2>&1 || true
          echo "Running 002_refunds_splits.sql..."
          npx wrangler d1 execute snap-it-db --file=src/db/migrations/002_refunds_splits.sql --remote 2>&1 || true
          echo "Migrations step complete (schema already applied)"

      - name: Inject secrets
        run: |
          echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY --name snap-it-forget-it-api-extract 2>&1
          echo "https://snap-it-and-forget-it.pages.dev,http://localhost:5173" | npx wrangler secret put ALLOWED_ORIGINS --name snap-it-forget-it-api-extract 2>&1

      - name: Deploy worker
        run: npx wrangler deploy --name snap-it-forget-it-api-extract 2>&1

      - name: Health check (basic — must pass)
        run: |
          sleep 10
          curl -sf https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev/health
          echo "Basic health: PASS"

      - name: Health check (full watchdog — warn only)
        run: |
          FULL=$(curl -s --max-time 15 https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev/health/full || echo '{}')
          echo "Full health response: $FULL"
          echo "$FULL" | grep -q '"db":true' && echo "D1: PASS" || echo "D1: WARN"
          echo "$FULL" | grep -q '"r2":true' && echo "R2: PASS" || echo "R2: WARN"
          echo "$FULL" | grep -q '"gemini_configured":true' && echo "Gemini: PASS" || echo "Gemini: WARN"
          echo "(Full watchdog result is informational — does not block deployment)"

  pages:
    name: Deploy Frontend to Cloudflare Pages
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: cd app && npm install

      - name: Build frontend
        run: cd app && npm run build
        env:
          VITE_API_URL: https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: snap-it-and-forget-it
          directory: app/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
