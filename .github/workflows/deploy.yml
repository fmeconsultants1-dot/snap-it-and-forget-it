name: Deploy

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            app/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run type-check
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          VITE_API_URL: https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: app/dist
          if-no-files-found: error

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: app/dist
      - name: Verify existing production schema
        run: npx wrangler d1 execute snap-it-db --file=src/db/schema-verify.sql --remote
      - name: Inject secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          printf '%s' 'https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev,https://snap-it-and-forget-it.pages.dev,http://localhost:5173' | npx wrangler secret put ALLOWED_ORIGINS
      - name: Deploy worker
        run: npx wrangler deploy --var "GIT_SHA:${{ github.sha }}"
      - name: Upload frontend assets, then publish index
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            key="${file#../app/dist/}"
            npx wrangler r2 object put "snap-it-documents/frontend/$key" --file="$file" --remote
          done < <(find ../app/dist -type f ! -name index.html -print0)
          npx wrangler r2 object put snap-it-documents/frontend/index.html --file=../app/dist/index.html --remote
      - name: Verify health, version and frontend
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node ../scripts/verify-production.mjs

  pages:
    name: Deploy Frontend to Cloudflare Pages
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: app/dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: snap-it-and-forget-it
          directory: app/dist
          branch: main
