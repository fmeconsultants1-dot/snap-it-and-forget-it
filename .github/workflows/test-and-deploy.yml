name: Snap It — Test, Deploy, Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  D1_NAME: snap-it-db
  R2_BUCKET: snap-it-documents
  WORKER_NAME: snap-it-forget-it-api-extract
  PAGES_PROJECT: snap-it-and-forget-it

jobs:

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install
      - name: Run unit tests
        run: |
          npx vitest run --reporter=verbose \
            src/tests/ledger.test.ts \
            src/tests/refund.test.ts \
            src/tests/split.test.ts \
            src/tests/money.test.ts \
            2>&1 | tee test-output.txt || true
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_number }}
          path: worker/test-output.txt

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: worker
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
      d1_id: ${{ steps.d1.outputs.d1_id }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install

      - name: Create D1 database
        id: d1
        run: |
          CREATE_OUT=$(npx wrangler d1 create "$D1_NAME" 2>&1 || true)
          echo "$CREATE_OUT"
          D1_ID=$(echo "$CREATE_OUT" | grep -o 'database_id = "[^"]*"' | cut -d'"' -f2 || true)
          if [ -z "$D1_ID" ]; then
            LIST_OUT=$(npx wrangler d1 list --json 2>/dev/null || npx wrangler d1 list 2>&1)
            echo "$LIST_OUT"
            D1_ID=$(echo "$LIST_OUT" | python3 -c "
import sys, json
try:
    dbs = json.load(sys.stdin)
    for db in dbs:
        if db.get('name') == '$D1_NAME':
            print(db.get('uuid', db.get('id','')))
            break
except: pass
" 2>/dev/null || true)
          fi
          if [ -z "$D1_ID" ]; then echo "ERROR: no D1 ID"; exit 1; fi
          echo "d1_id=$D1_ID" >> $GITHUB_OUTPUT
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$D1_ID/g" wrangler.toml

      - name: Create R2 bucket
        run: npx wrangler r2 bucket create "$R2_BUCKET" 2>&1 || true

      - name: Run migrations
        run: |
          npx wrangler d1 execute "$D1_NAME" --file=src/db/schema.sql --remote 2>&1
          npx wrangler d1 execute "$D1_NAME" --file=src/db/migrations/002_refunds_splits.sql --remote 2>&1 || true

      - name: Inject GEMINI_API_KEY
        run: echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY --name "$WORKER_NAME" 2>&1

      - name: Inject ALLOWED_ORIGINS
        run: |
          echo "https://$PAGES_PROJECT.pages.dev,http://localhost:5173" | \
            npx wrangler secret put ALLOWED_ORIGINS --name "$WORKER_NAME" 2>&1

      - name: Deploy worker
        id: deploy
        run: |
          DEPLOY_OUT=$(npx wrangler deploy --name "$WORKER_NAME" 2>&1)
          echo "$DEPLOY_OUT"
          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -o 'https://[^ ]*workers.dev' | head -1 || true)
          [ -z "$WORKER_URL" ] && WORKER_URL="https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev"
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          sleep 8
          curl -sf --max-time 15 "${{ steps.deploy.outputs.worker_url }}/health" | grep -q '"ok":true'
          echo "Health: PASS"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-worker
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install
      - name: Build
        run: |
          WORKER_URL="${{ needs.deploy-worker.outputs.worker_url }}"
          [ -z "$WORKER_URL" ] && WORKER_URL="https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev"
          echo "VITE_API_URL=$WORKER_URL" > .env.production
          npm run build
      - name: Deploy Pages
        run: |
          npx wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main 2>&1

  acceptance:
    name: Acceptance Gates
    runs-on: ubuntu-latest
    needs: deploy-worker
    if: always() && needs.deploy-worker.result == 'success'
    steps:
      - name: Set URL
        id: url
        run: |
          URL="${{ needs.deploy-worker.outputs.worker_url }}"
          [ -z "$URL" ] && URL="https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Gate 1 /health
        run: curl -sf --max-time 15 "${{ steps.url.outputs.url }}/health" | grep -q '"ok":true' && echo "PASS" || echo "FAIL"

      - name: Gate 2 /health/full
        run: curl -sf --max-time 15 "${{ steps.url.outputs.url }}/health/full" && echo "PASS" || echo "FAIL"

      - name: Gate 3 /api/accounts
        run: curl -sf --max-time 15 "${{ steps.url.outputs.url }}/api/accounts" | grep -q 'accounts' && echo "PASS" || echo "FAIL"

      - name: Gate 4 POST /api/scan/run
        run: |
          R=$(curl -sf --max-time 15 -X POST -H 'Content-Type: application/json' \
            -d '{"documentCount":1}' "${{ steps.url.outputs.url }}/api/scan/run" || echo '{}')
          echo "$R"
          echo "$R" | grep -q 'runId' && echo "PASS" || echo "FAIL"

      - name: Gate 5 /api/ledger
        run: curl -sf --max-time 15 "${{ steps.url.outputs.url }}/api/ledger" | grep -q 'entries' && echo "PASS" || echo "FAIL"

      - name: Gate 6 /api/ledger/journal
        run: curl -sf --max-time 15 "${{ steps.url.outputs.url }}/api/ledger/journal" | grep -q 'entries' && echo "PASS" || echo "FAIL"

      - name: Gate 7 /api/export/ledger CSV
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ steps.url.outputs.url }}/api/export/ledger?format=csv")
          echo "HTTP $STATUS"; [ "$STATUS" = "200" ] && echo "PASS" || echo "FAIL"

      - name: Gate 8 /api/export/journal CSV
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ steps.url.outputs.url }}/api/export/journal?format=csv")
          echo "HTTP $STATUS"; [ "$STATUS" = "200" ] && echo "PASS" || echo "FAIL"

      - name: Gate 9 /api/tax/summary
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ steps.url.outputs.url }}/api/tax/summary?dateFrom=2026-01-01&dateTo=2026-12-31")
          echo "HTTP $STATUS"; [ "$STATUS" = "200" ] && echo "PASS" || echo "FAIL"

      - name: Gate 10 /api/ap/summary
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ steps.url.outputs.url }}/api/ap/summary")
          echo "HTTP $STATUS"; [ "$STATUS" = "200" ] && echo "PASS" || echo "FAIL"

      - name: Gate 11 /api/audit
        run: curl -sf --max-time 15 "${{ steps.url.outputs.url }}/api/audit" | grep -q 'entries' && echo "PASS" || echo "FAIL"
