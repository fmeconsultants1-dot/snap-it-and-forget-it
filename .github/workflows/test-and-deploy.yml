name: Snap It — Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  D1_NAME: snap-it-db
  R2_BUCKET: snap-it-documents
  WORKER_NAME: snap-it-forget-it-api-extract
  PAGES_PROJECT: snap-it-and-forget-it

jobs:

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install
      - name: Run unit tests
        run: |
          npx vitest run --reporter=verbose \
            src/tests/ledger.test.ts \
            src/tests/refund.test.ts \
            src/tests/split.test.ts \
            src/tests/money.test.ts \
            2>&1 | tee test-output.txt || true
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_number }}
          path: worker/test-output.txt
