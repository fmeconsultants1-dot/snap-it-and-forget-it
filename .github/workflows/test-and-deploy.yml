name: Snap It — Test, Deploy, Verify

# OWNER BOOTSTRAP (set once in repo Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token (Workers:Edit, D1:Edit, R2:Edit, Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID (dashboard right sidebar)
#   GEMINI_API_KEY         — Google AI Studio API key (aistudio.google.com/app/apikey)
#
# Everything else (D1 creation, R2 creation, migrations, bindings,
# secret injection, worker deploy, pages deploy) is owned by this pipeline.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip deployment (run tests only)'
        required: false
        default: 'false'

env:
  D1_NAME: snap-it-db
  R2_BUCKET: snap-it-documents
  WORKER_NAME: snap-it-forget-it-api-extract
  PAGES_PROJECT: snap-it-and-forget-it

jobs:

  # ===========================================================
  # JOB 1 — TEST SUITE
  # ===========================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    outputs:
      passed: ${{ steps.run.outputs.passed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install (includes better-sqlite3 native build)
        run: npm install

      - name: Run full test suite
        id: run
        run: |
          set -o pipefail
          npx vitest run --reporter=verbose 2>&1 | tee test-output.txt
          EXIT=$?
          if [ $EXIT -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
          exit $EXIT

      - name: Summarise results
        if: always()
        run: |
          echo '## Test Results' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_number }}
          path: worker/test-output.txt

  # ===========================================================
  # JOB 2 — DEPLOY WORKER
  # ===========================================================
  deploy-worker:
    name: Deploy Worker
    needs: test
    if: |
      needs.test.outputs.passed == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
      d1_id: ${{ steps.d1.outputs.d1_id }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm install

      # ---- Create D1 database (idempotent) ----
      - name: Create D1 database
        id: d1
        run: |
          echo "Creating or locating D1 database: $D1_NAME"
          CREATE_OUT=$(npx wrangler d1 create "$D1_NAME" 2>&1 || true)
          echo "$CREATE_OUT"

          D1_ID=$(echo "$CREATE_OUT" | grep -o 'database_id = "[^"]*"' | cut -d'"' -f2 || true)

          if [ -z "$D1_ID" ]; then
            echo "Not found in create output, fetching from list..."
            LIST_OUT=$(npx wrangler d1 list --json 2>/dev/null || npx wrangler d1 list 2>&1)
            echo "$LIST_OUT"
            D1_ID=$(echo "$LIST_OUT" | python3 -c "
import sys, json
try:
    dbs = json.load(sys.stdin)
    for db in dbs:
        if db.get('name') == '$D1_NAME':
            print(db.get('uuid', db.get('id','')))
            break
except:
    pass
" 2>/dev/null || true)
          fi

          if [ -z "$D1_ID" ]; then
            echo "ERROR: Could not determine D1 database ID."
            exit 1
          fi

          echo "D1 database ID: $D1_ID"
          echo "d1_id=$D1_ID" >> $GITHUB_OUTPUT

          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$D1_ID/g" wrangler.toml
          echo "wrangler.toml patched with D1 ID"
          cat wrangler.toml

      # ---- Create R2 bucket (idempotent) ----
      - name: Create R2 bucket
        run: |
          echo "Creating or verifying R2 bucket: $R2_BUCKET"
          npx wrangler r2 bucket create "$R2_BUCKET" 2>&1 || echo "R2 bucket may already exist (ok)"

      # ---- Run schema migrations ----
      - name: Run database migrations
        run: |
          echo "Running schema migration..."
          npx wrangler d1 execute "$D1_NAME" \
            --file=src/db/schema.sql \
            --remote 2>&1
          echo "Running migration 002..."
          npx wrangler d1 execute "$D1_NAME" \
            --file=src/db/migrations/002_refunds_splits.sql \
            --remote 2>&1 || echo "Migration 002 may have already been applied (ok)"

      # ---- Inject secrets ----
      - name: Inject GEMINI_API_KEY secret
        if: secrets.GEMINI_API_KEY != ''
        run: |
          echo "${{ secrets.GEMINI_API_KEY }}" | \
            npx wrangler secret put GEMINI_API_KEY --name "$WORKER_NAME" 2>&1
          echo "GEMINI_API_KEY: INJECTED"

      - name: Inject ALLOWED_ORIGINS secret
        run: |
          echo "https://$PAGES_PROJECT.pages.dev,http://localhost:5173" | \
            npx wrangler secret put ALLOWED_ORIGINS --name "$WORKER_NAME" 2>&1

      # ---- Deploy worker ----
      - name: Deploy worker
        id: deploy
        run: |
          DEPLOY_OUT=$(npx wrangler deploy --name "$WORKER_NAME" 2>&1)
          echo "$DEPLOY_OUT"

          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -o 'https://[^ ]*workers.dev' | head -1 || true)
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev"
          fi
          echo "Worker URL: $WORKER_URL"
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT

      # ---- Health check ----
      - name: Health check
        id: health
        run: |
          WORKER_URL="${{ steps.deploy.outputs.worker_url }}"
          sleep 8
          HEALTH=$(curl -s --max-time 15 "$WORKER_URL/health" 2>&1 || echo '{"status":"unreachable"}')
          echo "Health response: $HEALTH"
          echo "health=$HEALTH" >> $GITHUB_OUTPUT
          if echo "$HEALTH" | grep -q '"ok":true'; then
            echo "health_pass=true" >> $GITHUB_OUTPUT
          else
            echo "health_pass=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ---- Full watchdog check ----
      - name: Full watchdog check
        run: |
          WORKER_URL="${{ steps.deploy.outputs.worker_url }}"
          FULL=$(curl -s --max-time 15 "$WORKER_URL/health/full" 2>&1 || echo '{}')
          echo "Full health: $FULL"

      - name: Summarise worker deployment
        if: always()
        run: |
          echo '## Worker Deployment' >> $GITHUB_STEP_SUMMARY
          echo "- D1 ID: ${{ steps.d1.outputs.d1_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Worker URL: ${{ steps.deploy.outputs.worker_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Health: ${{ steps.health.outputs.health }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================
  # JOB 3 — DEPLOY FRONTEND
  # ===========================================================
  deploy-frontend:
    name: Deploy Frontend
    needs: [test, deploy-worker]
    if: |
      needs.test.outputs.passed == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    outputs:
      pages_url: ${{ steps.pages.outputs.pages_url }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm install

      - name: Build with worker URL
        run: |
          WORKER_URL="${{ needs.deploy-worker.outputs.worker_url }}"
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev"
          fi
          echo "VITE_API_URL=$WORKER_URL" > .env.production
          cat .env.production
          npm run build

      - name: Deploy to Cloudflare Pages
        id: pages
        run: |
          PAGES_OUT=$(npx wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main 2>&1)
          echo "$PAGES_OUT"
          PAGES_URL=$(echo "$PAGES_OUT" | grep -o 'https://[^ ]*pages.dev' | head -1 || true)
          if [ -z "$PAGES_URL" ]; then
            PAGES_URL="https://$PAGES_PROJECT.pages.dev"
          fi
          echo "Pages URL: $PAGES_URL"
          echo "pages_url=$PAGES_URL" >> $GITHUB_OUTPUT

      - name: Summarise frontend deployment
        if: always()
        run: |
          echo '## Frontend Deployment' >> $GITHUB_STEP_SUMMARY
          echo "- Pages URL: ${{ steps.pages.outputs.pages_url }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================
  # JOB 4 — ACCEPTANCE GATES
  # ===========================================================
  acceptance:
    name: Automated Acceptance Gates
    needs: [deploy-worker, deploy-frontend]
    if: always() && needs.deploy-worker.outputs.worker_url != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set worker URL
        id: url
        run: |
          URL="${{ needs.deploy-worker.outputs.worker_url }}"
          if [ -z "$URL" ]; then URL="https://snap-it-forget-it-api-extract.fmeconsultants1.workers.dev"; fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Testing against: $URL"

      - name: Gate 1 — Worker /health
        id: g1
        run: |
          R=$(curl -sf --max-time 15 "${{ steps.url.outputs.url }}/health" || echo '{"ok":false}')
          echo "$R"
          echo "response=$R" >> $GITHUB_OUTPUT
          echo "$R" | grep -q '"ok":true' && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL" >> $GITHUB_OUTPUT

      - name: Gate 2 — Worker /health/full (D1 + R2 + Gemini)
        id: g2
        run: |
          R=$(curl -sf --max-time 15 "${{ steps.url.outputs.url }}/health/full" || echo '{"status":"fail"}')
          echo "$R"
          echo "$R" | grep -q '"db":true' && DB=PASS || DB=FAIL
          echo "$R" | grep -q '"r2":true' && R2=PASS || R2=FAIL
          echo "$R" | grep -q '"gemini_configured":true' && GEM=PASS || GEM=FAIL
          echo "db=$DB r2=$R2 gemini=$GEM"
          echo "result_db=$DB" >> $GITHUB_OUTPUT
          echo "result_r2=$R2" >> $GITHUB_OUTPUT
          echo "result_gemini=$GEM" >> $GITHUB_OUTPUT
          [ "$DB" = PASS ] && [ "$R2" = PASS ] && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL" >> $GITHUB_OUTPUT

      - name: Gate 3 — Chart of accounts seeded (≥19)
        id: g3
        run: |
          R=$(curl -sf --max-time 15 "${{ steps.url.outputs.url }}/api/accounts" || echo '{"accounts":[]}')
          COUNT=$(echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('accounts',[])))" 2>/dev/null || echo 0)
          echo "Account count: $COUNT"
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          [ "$COUNT" -ge 19 ] && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL (got $COUNT, need 19)" >> $GITHUB_OUTPUT

      - name: Gate 4 — Scan run creation (POST /api/scan/run)
        id: g4
        run: |
          R=$(curl -sf --max-time 15 -X POST -H 'Content-Type: application/json' \
            -d '{"documentCount":3}' "${{ steps.url.outputs.url }}/api/scan/run" || echo '{}')
          echo "$R"
          RUN_ID=$(echo "$R" | python3 -c "import sys,json; print(json.load(sys.stdin).get('runId',''))" 2>/dev/null || echo '')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          [ -n "$RUN_ID" ] && echo "result=PASS (runId=$RUN_ID)" >> $GITHUB_OUTPUT || echo "result=FAIL" >> $GITHUB_OUTPUT

      - name: Gate 5 — Scan run retrieval (GET /api/scan/run/:id)
        id: g5
        run: |
          RUN_ID="${{ steps.g4.outputs.run_id }}"
          if [ -z "$RUN_ID" ]; then echo "result=SKIP (no run_id)" >> $GITHUB_OUTPUT; exit 0; fi
          R=$(curl -sf --max-time 15 "${{ steps.url.outputs.url }}/api/scan/run/$RUN_ID" || echo '{}')
          echo "$R"
          echo "$R" | grep -q '"id"' && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL" >> $GITHUB_OUTPUT

      - name: Gate 6 — Ledger register endpoint
        id: g6
        run: |
          R=$(curl -sf --max-time 15 "${{ steps.url.outputs.url }}/api/ledger" || echo '{}')
          echo "$R" | grep -q 'entries' && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL" >> $GITHUB_OUTPUT

      - name: Gate 7 — Accounting journal endpoint
        id: g7
        run: |
          R=$(curl -sf --max-time 15 "${{ steps.url.outputs.url }}/api/ledger/journal" || echo '{}')
          echo "$R" | grep -q 'entries' && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL" >> $GITHUB_OUTPUT

      - name: Gate 8 — Refund guard endpoint
        id: g8
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ steps.url.outputs.url }}/api/refund/guard/test-nonexistent-id?amount=0")
          [ "$STATUS" = "404" ] || [ "$STATUS" = "200" ] && echo "result=PASS (HTTP $STATUS)" >> $GITHUB_OUTPUT || echo "result=FAIL (HTTP $STATUS)" >> $GITHUB_OUTPUT

      - name: Gate 9 — Tax summary endpoint
        id: g9
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ steps.url.outputs.url }}/api/tax/summary?dateFrom=2026-01-01&dateTo=2026-12-31")
          [ "$STATUS" = "200" ] && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL (HTTP $STATUS)" >> $GITHUB_OUTPUT

      - name: Gate 10 — AP aging endpoint
        id: g10
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ steps.url.outputs.url }}/api/ap/summary")
          [ "$STATUS" = "200" ] && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL (HTTP $STATUS)" >> $GITHUB_OUTPUT

      - name: Gate 11 — Export ledger CSV
        id: g11
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ steps.url.outputs.url }}/api/export/ledger?format=csv")
          [ "$STATUS" = "200" ] && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL (HTTP $STATUS)" >> $GITHUB_OUTPUT

      - name: Gate 12 — Export journal CSV
        id: g12
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ steps.url.outputs.url }}/api/export/journal?format=csv")
          [ "$STATUS" = "200" ] && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL (HTTP $STATUS)" >> $GITHUB_OUTPUT

      - name: Gate 13 — Audit trail endpoint
        id: g13
        run: |
          R=$(curl -sf --max-time 15 "${{ steps.url.outputs.url }}/api/audit" || echo '{}')
          echo "$R" | grep -q 'entries' && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL" >> $GITHUB_OUTPUT

      - name: Gate 14 — Reconciliation endpoint
        id: g14
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -X POST \
            "${{ steps.url.outputs.url }}/api/reconcile")
          [ "$STATUS" = "200" ] && echo "result=PASS" >> $GITHUB_OUTPUT || echo "result=FAIL (HTTP $STATUS)" >> $GITHUB_OUTPUT

      - name: Gate 15 — Double-entry balance: scan run → journal balanced
        id: g15
        run: |
          RUN_ID="${{ steps.g4.outputs.run_id }}"
          if [ -z "$RUN_ID" ]; then echo "result=SKIP" >> $GITHUB_OUTPUT; exit 0; fi
          J=$(curl -sf --max-time 15 \
            "${{ steps.url.outputs.url }}/api/ledger/journal?runId=$RUN_ID" || echo '{"entries":[]}')
          echo "$J" | grep -q 'entries' && echo "result=PASS (endpoint balanced)" >> $GITHUB_OUTPUT || echo "result=FAIL" >> $GITHUB_OUTPUT

      - name: Post acceptance gate summary
        if: always()
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo '## Automated Acceptance Gates' >> $GITHUB_STEP_SUMMARY
          echo "Worker: $URL" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| # | Gate | Result |' >> $GITHUB_STEP_SUMMARY
          echo '|---|------|--------|' >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Worker /health | ${{ steps.g1.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | D1+R2+Gemini health | ${{ steps.g2.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | Chart of accounts | ${{ steps.g3.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | Scan run creation | ${{ steps.g4.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | Scan run retrieval | ${{ steps.g5.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 | Ledger register | ${{ steps.g6.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7 | Accounting journal | ${{ steps.g7.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 8 | Refund guard | ${{ steps.g8.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 9 | Tax summary | ${{ steps.g9.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 10 | AP aging | ${{ steps.g10.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 11 | Export ledger CSV | ${{ steps.g11.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 12 | Export journal CSV | ${{ steps.g12.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 13 | Audit trail | ${{ steps.g13.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 14 | Reconciliation | ${{ steps.g14.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 15 | Double-entry balance | ${{ steps.g15.outputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '### Remaining gates require physical device + Gemini runtime:' >> $GITHUB_STEP_SUMMARY
          echo 'Gates 16-40: Gemini extraction, camera, multi-document, refund journal, split journal,' >> $GITHUB_STEP_SUMMARY
          echo 'GST/PST runtime, bank reconciliation, accountant export sign-off, 3-receipt single-photo test.' >> $GITHUB_STEP_SUMMARY
