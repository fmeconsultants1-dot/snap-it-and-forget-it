name: Snap It Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Worker Tests (SQLite Runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (includes better-sqlite3)
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true  # Type errors don't block runtime tests

      - name: Money arithmetic unit tests
        run: npx vitest run src/tests/money.test.ts --reporter=verbose

      - name: Ledger unit tests (pure functions)
        run: npx vitest run src/tests/ledger.test.ts --reporter=verbose

      - name: Refund unit tests (pure functions)
        run: npx vitest run src/tests/refund.test.ts --reporter=verbose

      - name: Split unit tests (pure functions)
        run: npx vitest run src/tests/split.test.ts --reporter=verbose

      - name: Runtime tests T7A-T7G + REFUND-01/02/03 (real SQLite)
        run: npx vitest run src/tests/runtime/refund.runtime.test.ts --reporter=verbose

      - name: Runtime tests TS1-TS7 splits (real SQLite)
        run: npx vitest run src/tests/runtime/split.runtime.test.ts --reporter=verbose
